; Project ORBIT starter configuration.
; Provisional target only. Confirm exact Robocraze board before flashing.
[env:orbit-sat-provisional]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
